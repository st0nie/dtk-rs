[package]
name = "dtk-sys"
version = "0.1.0"
edition = "2024"
license = "MIT"
links = "dtk6widget"

[dependencies]
# cxx, cxx-build and dtk-cxxqt's cxx-gen must be the same release: CXX
# embeds its version in every C++ symbol (cxxbridge1$<patch>$...).
cxx = "=1.0.205"

[build-dependencies]
cxx-build = "=1.0.205"
pkg-config = "0.3"
